<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%94%92%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f0f2f6;--card:#fff;--ink:#31333f;--muted:#6b6f7b;--line:#d0d3db;--red:#ff4b4b;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0e1117;--card:#1a1c24;--ink:#fafafa;--muted:#a3a8b8;--line:#454856;--bad:#ff8a80}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding:16px}
form{background:var(--card);border-radius:14px;padding:28px 26px;width:100%;max-width:360px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
h1{font-size:22px;margin:0 0 4px}p{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.5}
label{display:block;font-size:13px;margin:0 0 6px}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
input[type=password]:focus{outline:2px solid var(--red);outline-offset:1px}
.keep{display:flex;gap:8px;align-items:center;margin:12px 0 16px;font-size:13px;color:var(--muted)}
button{width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--red);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}#err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
</style></head><body>
<form id="f" autocomplete="off"><h1>🔄 가스인 컨버터</h1><p>허가된 사용자만 쓸 수 있습니다. 비밀번호를 입력해 주세요.</p>
<label for="pw">비밀번호</label><input type="password" id="pw" required autofocus>
<label class="keep"><input type="checkbox" id="keep"> 이 PC에서 로그인 유지</label>
<button id="go" type="submit">들어가기</button><div id="err" role="alert"></div></form>

var b64=function(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
var ub64=function(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
function get(){try{return sessionStorage.getItem('gc_k')||localStorage.getItem('gc_k')}catch(e){return null}}
function save(raw,keep){try{sessionStorage.setItem('gc_k',raw);if(keep)localStorage.setItem('gc_k',raw)}catch(e){}}
function clear(){try{sessionStorage.removeItem('gc_k');localStorage.removeItem('gc_k')}catch(e){}}
async function dec(raw){
  var key=await crypto.subtle.importKey('raw',b64(raw),'AES-GCM',false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},key,b64(D.ct));
  return new TextDecoder().decode(pt);
}
function show(html){var go=function(){document.open();document.write(html);document.close();};if(document.readyState==='complete')go();else window.addEventListener('load',function(){setTimeout(go,0)});}
async function derive(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(D.salt),iterations:D.iter},base,256);
  return ub64(bits);
}
var saved=get();
if(saved){dec(saved).then(show,function(){clear()})}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();var btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;err.textContent='확인하는 중…';
  try{var raw=await derive(document.getElementById('pw').value);var html=await dec(raw);save(raw,document.getElementById('keep').checked);show(html)}
  catch(x){err.textContent='비밀번호가 맞지 않습니다.';btn.disabled=false;document.getElementById('pw').select()}
});
})();
</script></body></html>
